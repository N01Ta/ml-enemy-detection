[package]
name = "vision-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ort = { version = "=2.0.0-rc.13", features = ["load-dynamic", "cuda", "tensorrt", "directml"] }
ultralytics-inference = { version = "0.0.49", default-features = false, features = ["cuda", "tensorrt", "cuda-preprocess", "directml"] }
image = { version = "0.25", default-features = false }
procmod-overlay = "3.0.1"
windows = { version = "0.62", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Foundation",
] }
windows-capture = "2.0.1"

[patch.crates-io]
procmod-overlay = { path = "vendor/procmod-overlay" }
